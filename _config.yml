title: NZIC — New Zealand Immigration Consultancy
description: Expert New Zealand immigration advice and visa services.
url: "https://linomiguel.github.io"
baseurl: "/NZIC"

# Build
markdown: kramdown
highlighter: rouge

# GitHub Pages native plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - docs
  - README.md
